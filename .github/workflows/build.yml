name: Terrastep CI

on:
  push:
    branches: [main, "muse/complete-build-v1"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a release APK"
        type: boolean
        default: false
      api_base:
        description: "Public server URL baked into the APK (e.g. https://terrastep-server.onrender.com). Empty = local dev default."
        type: string
        required: false
        default: ""

jobs:
  server-tests:
    name: Referee + server tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install h3 pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  app-build:
    name: Flutter analyze + APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Pinned: floating 'stable' broke analyze when newer Flutter changed
      # theme/color/radio APIs; the code targets the 3.35 API surface.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze (must be clean)
        working-directory: app
        run: flutter analyze
      - name: Build debug APK (compiles Dart + Kotlin tracker)
        working-directory: app
        env:
          API_BASE: ${{ inputs.api_base }}
        run: |
          if [ -n "$API_BASE" ]; then
            echo "Baking API base into APK: $API_BASE"
            flutter build apk --debug --dart-define=TERRASTEP_API="$API_BASE"
          else
            flutter build apk --debug
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: terrastep-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Build release APK (manual runs only)
        if: ${{ inputs.release }}
        working-directory: app
        run: flutter build apk --release
      - name: Upload release APK
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: terrastep-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
